project_name: CareerVue

project_description: |
  Our web app is going to be based on LinkedIn but designed in a specialised manner to consider only job postings, inorder to streamline the job searching processing while being sustainable and inclusive. It is designed to tackle Goal 4 (Quality Education) and Goal 8 (Work and Economic Development).

